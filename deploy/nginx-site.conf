# Nginx reverse proxy configuration for The Shortcut Academy
# Replace YOUR_DOMAIN with your actual domain name throughout this file
# After editing, run: sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN

server {
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/shortcut-academy.access.log;
    error_log /var/log/nginx/shortcut-academy.error.log;

    # Redirect www to non-www
    if ($host = www.YOUR_DOMAIN) { return 301 https://YOUR_DOMAIN$request_uri; }

    # Performance & Gzip optimizations
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2 font/ttf;

    # Proxy buffers for smooth streaming & fast responses
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    # SSL will be configured automatically by Certbot
    listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
}

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}
